# ساخت نسخه‌های برنامه (اندروید ‎.apk‎، ویندوز ‎.exe‎، مک ‎.dmg‎).
# هر سه فقط خود سایت را باز می‌کنند، پس تغییرات سایت بدون ساخت دوباره در برنامه‌ها هم دیده می‌شود.
# روی main خروجی‌ها در Releases منتشر می‌شوند و پیوندهای ‎releases/latest/download/…‎ در سایت به آن‌ها اشاره دارند.
# اندروید به دو Secret نیاز دارد: ANDROID_KEYSTORE_BASE64 و ANDROID_KEYSTORE_PASSWORD (راهنما: apps/README.md).
name: App builds

on:
  push:
    branches: [main]
    paths: ['apps/**', '.github/workflows/apps.yml', 'icon-512.png']
  pull_request:
    paths: ['apps/**', '.github/workflows/apps.yml', 'icon-512.png']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Android build tools
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;36.1.0" "platforms;android-36" > /dev/null
          # Bubblewrap expects sdkmanager at $ANDROID_HOME/bin.
          [ -e "$ANDROID_HOME/bin" ] || ln -s "$(dirname "$SDKM")" "$ANDROID_HOME/bin"
      - name: Signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            # مقدار طولانی را حتی اگر با فاصله، شکست خط، برچسب یا متن اضافه کپی شده باشد پیدا می‌کند.
            if ! printf '%s' "$KS" | python3 -c '
          import base64, re, sys
          raw = sys.stdin.read()
          cands = [re.sub(r"\s+", "", raw)]
          toks = re.split(r"[\s\"\x27`]+", raw)
          toks = [re.sub(r"^[A-Za-z0-9_]+[=:]", "", t) for t in toks]
          cands += sorted(toks, key=len, reverse=True)
          cands.append("".join(re.findall(r"[A-Za-z0-9+/=_-]{40,}", raw)))
          for c in cands:
              c = c.strip().replace("-", "+").replace("_", "/").rstrip("=")
              if len(c) < 500: continue
              try:
                  b = base64.b64decode(c + "=" * (-len(c) % 4), validate=True)
              except Exception:
                  continue
              if b[:4] in (b"\xfe\xed\xfe\xed",) or b[:1] == b"\x30":
                  sys.stdout.buffer.write(b); sys.exit(0)
          bad = sorted({hex(ord(ch)) for ch in raw if not re.match(r"[A-Za-z0-9+/=\s]", ch)})[:10]
          print(f"secret length {len(raw)}, lines {raw.count(chr(10))+1}, other characters {bad}", file=sys.stderr)
          sys.exit(1)
          ' > android.keystore; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid. Paste the whole long line from android-signing-key.txt again (only that line, nothing before or after it)."
              exit 1
            fi
            if ! keytool -list -keystore android.keystore -storepass "$PW" -alias hezbkhani > /dev/null 2>&1; then
              echo "::error::The keystore did not open. Check ANDROID_KEYSTORE_PASSWORD (the short line) and that ANDROID_KEYSTORE_BASE64 is the complete long line."
              exit 1
            fi
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD not set: building with a throwaway key, the .apk will not be published."
            keytool -genkeypair -keystore android.keystore -alias hezbkhani -keyalg RSA -keysize 2048 -validity 1000 \
              -storepass temp-pass -keypass temp-pass -dname "CN=Test"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=temp-pass" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=temp-pass" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          jq --argjson c ${{ github.run_number }} --arg n "$APP_VERSION" '.appVersionCode=$c | .appVersionName=$n' twa-manifest.json > m.json && mv m.json twa-manifest.json
          npm install -g @bubblewrap/cli@1.25.0
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json < /dev/null
          bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json < /dev/null
          mkdir -p ../../out && cp app-release-signed.apk ../../out/Hezbkhani.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/Hezbkhani.apk }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Build
        run: |
          jq --arg v "$APP_VERSION" '.version=$v' src-tauri/tauri.conf.json > c.json && mv c.json src-tauri/tauri.conf.json
          npx --yes @tauri-apps/cli@2.12.0 icon ../../icon-512.png
          npx --yes @tauri-apps/cli@2.12.0 build ${{ matrix.args }}
          mkdir -p ../../out
          if [ "$RUNNER_OS" = Windows ]; then
            cp src-tauri/target/release/bundle/nsis/*-setup.exe ../../out/Hezbkhani-Setup.exe
          else
            cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ../../out/Hezbkhani.dmg
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: out/*

  release:
    needs: [android, desktop]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Drop the unsigned test APK
        if: needs.android.outputs.signed != 'true'
        run: rm -f out/Hezbkhani.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.APP_VERSION }}
          name: نسخه‌های برنامه ${{ env.APP_VERSION }}
          make_latest: true
          files: out/*
          body: |
            نسخه‌های برنامه نوران. همه فقط سایت https://hezbkhani.github.io/ را باز می‌کنند.
            - اندروید: Hezbkhani.apk
            - ویندوز: Hezbkhani-Setup.exe
            - مک: Hezbkhani.dmg
