# ساخت نسخه‌های برنامه (اندروید ‎.apk‎، ویندوز ‎.exe‎، مک ‎.dmg‎).
# هر سه فقط خود سایت را باز می‌کنند، پس تغییرات سایت بدون ساخت دوباره در برنامه‌ها هم دیده می‌شود.
# روی main خروجی‌ها در Releases منتشر می‌شوند و پیوندهای ‎releases/latest/download/…‎ در سایت به آن‌ها اشاره دارند.
# اندروید به دو Secret نیاز دارد: ANDROID_KEYSTORE_BASE64 و ANDROID_KEYSTORE_PASSWORD (راهنما: apps/README.md).
name: App builds

on:
  push:
    branches: [main]
    paths: ['apps/**', '.github/workflows/apps.yml', 'icon-512.png']
  pull_request:
    paths: ['apps/**', '.github/workflows/apps.yml', 'icon-512.png']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: android-actions/setup-android@v3
      - name: Android build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;36.1.0" "platforms;android-36" > /dev/null
      - name: Signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            echo "$KS" | base64 -d > android.keystore
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD not set: building with a throwaway key, the .apk will not be published."
            keytool -genkeypair -keystore android.keystore -alias hezbkhani -keyalg RSA -keysize 2048 -validity 1000 \
              -storepass temp-pass -keypass temp-pass -dname "CN=Test"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=temp-pass" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=temp-pass" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          jq --argjson c ${{ github.run_number }} --arg n "$APP_VERSION" '.appVersionCode=$c | .appVersionName=$n' twa-manifest.json > m.json && mv m.json twa-manifest.json
          npm install -g @bubblewrap/cli@1.25.0
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json < /dev/null
          bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json < /dev/null
          mkdir -p ../../out && cp app-release-signed.apk ../../out/Hezbkhani.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/Hezbkhani.apk }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Build
        run: |
          jq --arg v "$APP_VERSION" '.version=$v' src-tauri/tauri.conf.json > c.json && mv c.json src-tauri/tauri.conf.json
          npx --yes @tauri-apps/cli@2.12.0 icon ../../icon-512.png
          npx --yes @tauri-apps/cli@2.12.0 build ${{ matrix.args }}
          mkdir -p ../../out
          if [ "$RUNNER_OS" = Windows ]; then
            cp src-tauri/target/release/bundle/nsis/*-setup.exe ../../out/Hezbkhani-Setup.exe
          else
            cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ../../out/Hezbkhani.dmg
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: out/*

  release:
    needs: [android, desktop]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Drop the unsigned test APK
        if: needs.android.outputs.signed != 'true'
        run: rm -f out/Hezbkhani.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.APP_VERSION }}
          name: نسخه‌های برنامه ${{ env.APP_VERSION }}
          make_latest: true
          files: out/*
          body: |
            نسخه‌های برنامه حزب‌خوانی. همه فقط سایت https://hezbkhani.github.io/ را باز می‌کنند.
            - اندروید: Hezbkhani.apk
            - ویندوز: Hezbkhani-Setup.exe
            - مک: Hezbkhani.dmg
