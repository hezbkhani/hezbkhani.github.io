<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#006b50"><link rel="icon" type="image/png" href="/icon-192.png"><link rel="canonical" href="https://nooranquran.github.io/"><title>نوران به نشانی تازه رفت</title>
<script>
/* نوران به https://nooranquran.github.io منتقل شد. این صفحه بازدیدکننده را به همان‌جا می‌برد و داده‌های ذخیره‌شدهٔ
   مرورگر (ورود، تنظیمات، پیشرفت خواندن و…) را در #nqmigrate=… با خود می‌برد؛ index.html نشانی تازه آن‌ها را وارد می‌کند. */
(function () {
  var T = 'https://nooranquran.github.io', path = location.pathname, h = location.hash;
  var root = path === '/' || path === '/index.html';
  var target = T + (root ? '/' : path) + location.search;
  function go(oldPush) {
    var d = {};
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); d[k] = localStorage.getItem(k); } } catch (e) {}
    if (oldPush) d.nqOldPush = oldPush;
    var keys = Object.keys(d);
    if (!root || !keys.length) return location.replace(target + h);
    var enc = function () { return btoa(unescape(encodeURIComponent(JSON.stringify(d)))); }, s = enc();
    // نشانی‌های خیلی بلند را بعضی مرورگرها باز نمی‌کنند؛ اگر داده خیلی بزرگ بود بزرگ‌ترین کلیدها (معمولاً عکس پس‌زمینه) کنار می‌روند.
    keys.sort(function (a, b) { return String(d[b]).length - String(d[a]).length; });
    while (s.length > 1500000 && keys.length) { delete d[keys.shift()]; s = enc(); }
    location.replace(target + '#nqmigrate=' + encodeURIComponent(s) + (h ? '&nqhash=' + encodeURIComponent(h) : ''));
  }
  var done = false, finish = function (e) { if (!done) { done = true; go(e); } };
  setTimeout(finish, 1500);
  try {
    navigator.serviceWorker.getRegistration().then(function (r) { return r && r.pushManager && r.pushManager.getSubscription(); })
      .then(function (s) { finish(s && s.endpoint); }, function () { finish(); });
  } catch (e) { finish(); }
})();
</script>
